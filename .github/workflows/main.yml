name: FoodHub .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore FoodHubApi/FoodHubApi.csproj

    - name: Build
      run: dotnet build FoodHubApi/FoodHubApi.csproj --no-restore

    - name: Auto-fix Dockerfile Links
      run: |
        sed -i 's|FROM ://microsoft.com AS build|FROM ://microsoft.com AS build|g' FoodHubApi/Dockerfile
        sed -i 's|FROM ://microsoft.com AS final|FROM ://microsoft.com AS final|g' FoodHubApi/Dockerfile

    - name: Build Docker Image
      run: docker build -t foodhub-api:latest -f FoodHubApi/Dockerfile .

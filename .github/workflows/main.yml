name: FoodHub CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FoodHubApi/FoodHubApi.csproj

      - name: Build Code
        run: dotnet build FoodHubApi/FoodHubApi.csproj --no-restore -c Release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./FoodHubApi
          file: ./FoodHubApi/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/netrololo/foodhub-api:latest
            ghcr.io/netrololo/foodhub-api:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./FoodHubClient
          file: ./FoodHubClient/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/netrololo/foodhub-client:latest
            ghcr.io/netrololo/foodhub-client:${{ github.sha }}
